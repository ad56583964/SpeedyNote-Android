[binaries]
c = '${CC}'
cpp = '${CXX}'
ar = '${AR}'
strip = '${STRIP}'
pkgconfig = 'pkg-config'

[built-in options]
c_args = ['-fPIC']
cpp_args = ['-fPIC']
c_link_args = []
cpp_link_args = []

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[target_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[paths]
prefix = '${INSTALL_PREFIX}'
libdir = 'lib'
bindir = 'bin'
includedir = 'include'

[properties]
needs_exe_wrapper = true
